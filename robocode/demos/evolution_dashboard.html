<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robocode Evolution Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            color: #00ff88;
            font-size: 28px;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
        }

        .status-running {
            background: #00ff88;
            color: #1a1a2e;
            animation: pulse 2s infinite;
        }

        .status-idle {
            background: #666;
            color: #fff;
        }

        .status-completed {
            background: #4a9eff;
            color: #fff;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card h2 {
            color: #00ff88;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #00ff88;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .leaderboard {
            max-height: 400px;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }

        .leaderboard-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .rank {
            width: 40px;
            font-size: 20px;
            font-weight: bold;
            color: #00ff88;
        }

        .rank.gold { color: #ffd700; }
        .rank.silver { color: #c0c0c0; }
        .rank.bronze { color: #cd7f32; }

        .bot-info {
            flex: 1;
        }

        .bot-name {
            font-weight: bold;
            color: #fff;
        }

        .bot-genome {
            font-size: 12px;
            color: #888;
        }

        .bot-elo {
            font-size: 24px;
            font-weight: bold;
            color: #4a9eff;
        }

        .activity-feed {
            max-height: 300px;
            overflow-y: auto;
        }

        .activity-item {
            padding: 10px;
            border-left: 3px solid #00ff88;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 0 8px 8px 0;
        }

        .activity-item.milestone {
            border-left-color: #ffd700;
        }

        .activity-item.evolution {
            border-left-color: #4a9eff;
        }

        .activity-time {
            font-size: 11px;
            color: #666;
        }

        .activity-message {
            margin-top: 5px;
        }

        .current-task {
            background: rgba(0,255,136,0.1);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0,255,136,0.3);
        }

        .heartbeat {
            font-size: 12px;
            color: #666;
        }

        .heartbeat.live {
            color: #00ff88;
        }

        .heartbeat.stale {
            color: #ff4444;
        }

        .genome-bar {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .genome-tag {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: rgba(74,158,255,0.2);
            color: #4a9eff;
        }

        .population-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .pop-card {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .pop-name {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .pop-elo {
            font-size: 20px;
            color: #4a9eff;
        }

        .pop-strategy {
            font-size: 10px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Robocode Evolution</h1>
            <div>
                <span class="status-badge" id="status">LOADING</span>
                <span class="heartbeat" id="heartbeat"></span>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <h2>Evolution Status</h2>
                <div class="stat-grid">
                    <div class="stat">
                        <div class="stat-value" id="generation">-</div>
                        <div class="stat-label">Generation</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="population">-</div>
                        <div class="stat-label">Population</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="battles">-</div>
                        <div class="stat-label">Total Battles</div>
                    </div>
                </div>
                <div class="current-task" id="current-task" style="margin-top: 15px;">
                    No active task
                </div>
            </div>

            <div class="card">
                <h2>Best Bot</h2>
                <div id="best-bot">
                    <p style="color: #888;">No data yet</p>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>Leaderboard</h2>
                <div class="leaderboard" id="leaderboard">
                    <p style="color: #888; padding: 20px;">Loading...</p>
                </div>
            </div>

            <div class="card">
                <h2>Activity Feed</h2>
                <div class="activity-feed" id="activity-feed">
                    <p style="color: #888; padding: 20px;">No activity yet</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Current Population</h2>
            <div class="population-grid" id="population-grid">
                <p style="color: #888; padding: 20px;">No population data</p>
            </div>
        </div>
    </div>

    <script>
        const BASE_PATH = '..';

        async function loadJSON(path) {
            try {
                const response = await fetch(`${BASE_PATH}/${path}?t=${Date.now()}`);
                if (!response.ok) throw new Error('Not found');
                return await response.json();
            } catch (e) {
                console.error(`Failed to load ${path}:`, e);
                return null;
            }
        }

        function formatTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleTimeString();
        }

        function getHeartbeatStatus(lastHeartbeat) {
            if (!lastHeartbeat) return { text: 'Unknown', class: '' };
            const diff = Date.now() - new Date(lastHeartbeat).getTime();
            const seconds = Math.floor(diff / 1000);

            if (seconds < 60) {
                return { text: `LIVE (${seconds}s ago)`, class: 'live' };
            } else if (seconds < 300) {
                return { text: `${Math.floor(seconds/60)}m ago`, class: '' };
            } else {
                return { text: 'STALE', class: 'stale' };
            }
        }

        async function updateDashboard() {
            // Load state
            const state = await loadJSON('data/evolution_state.json');
            const population = await loadJSON('data/population.json');
            const elo = await loadJSON('data/elo_ratings.json');

            if (state) {
                // Status badge
                const statusEl = document.getElementById('status');
                statusEl.textContent = state.status?.toUpperCase() || 'UNKNOWN';
                statusEl.className = `status-badge status-${state.status || 'idle'}`;

                // Heartbeat
                const hb = getHeartbeatStatus(state.last_heartbeat);
                const hbEl = document.getElementById('heartbeat');
                hbEl.textContent = hb.text;
                hbEl.className = `heartbeat ${hb.class}`;

                // Stats
                document.getElementById('generation').textContent = state.generation || 0;
                document.getElementById('battles').textContent = state.total_battles || 0;

                // Current task
                const taskEl = document.getElementById('current-task');
                if (state.current_task) {
                    taskEl.innerHTML = `
                        <strong>${state.current_task.description}</strong>
                        <div style="font-size: 12px; color: #888; margin-top: 5px;">
                            Started: ${formatTime(state.current_task.timestamp)}
                        </div>
                    `;
                } else {
                    taskEl.textContent = 'No active task';
                }

                // Best bot
                const bestEl = document.getElementById('best-bot');
                if (state.best_bot) {
                    bestEl.innerHTML = `
                        <div style="font-size: 24px; color: #ffd700; margin-bottom: 10px;">
                            🏆 ${state.best_bot.id}
                        </div>
                        <div style="font-size: 36px; color: #00ff88;">
                            Elo ${state.best_bot.elo}
                        </div>
                        <div class="genome-bar">
                            <span class="genome-tag">${state.best_bot.genome || 'Unknown'}</span>
                        </div>
                    `;
                }

                // Activity feed
                const activityEl = document.getElementById('activity-feed');
                if (state.activity_feed && state.activity_feed.length > 0) {
                    activityEl.innerHTML = state.activity_feed.slice(0, 10).map(act => `
                        <div class="activity-item ${act.type}">
                            <div class="activity-time">${formatTime(act.timestamp)}</div>
                            <div class="activity-message">${act.message}</div>
                        </div>
                    `).join('');
                }
            }

            if (population) {
                document.getElementById('population').textContent = population.bots?.length || 0;

                // Population grid
                const popEl = document.getElementById('population-grid');
                if (population.bots && population.bots.length > 0) {
                    popEl.innerHTML = population.bots.map(bot => `
                        <div class="pop-card">
                            <div class="pop-name">${bot.id}</div>
                            <div class="pop-elo">${bot.stats?.elo || 1500}</div>
                            <div class="pop-strategy">
                                ${bot.genome?.movement_module || '?'} + ${bot.genome?.gun_module || '?'}
                            </div>
                        </div>
                    `).join('');
                }
            }

            if (elo && elo.ratings) {
                // Leaderboard
                const sorted = Object.entries(elo.ratings)
                    .sort((a, b) => b[1].elo - a[1].elo)
                    .slice(0, 15);

                const lbEl = document.getElementById('leaderboard');
                lbEl.innerHTML = sorted.map((entry, i) => {
                    const [name, stats] = entry;
                    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
                    return `
                        <div class="leaderboard-item">
                            <div class="rank ${rankClass}">#${i + 1}</div>
                            <div class="bot-info">
                                <div class="bot-name">${name}</div>
                                <div class="bot-genome">${stats.type || 'unknown'} • ${stats.battles || 0} battles</div>
                            </div>
                            <div class="bot-elo">${stats.elo}</div>
                        </div>
                    `;
                }).join('');
            }
        }

        // Initial load
        updateDashboard();

        // Refresh every 5 seconds
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
