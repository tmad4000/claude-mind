name: Deploy stamped GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/stamp-version.sh version.json
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check existing rendered URLs and hidden-file exclusion
        run: |
          test -f _site/DIRECTIONS.html
          test -f _site/INDEX.html
          test -f _site/CLAUDE.html
          test -f _site/version.json
          test ! -e _site/.claude
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
