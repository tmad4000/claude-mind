<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Idea Bank - Claude Mind</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1em;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .controls button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .controls button:hover {
            background: rgba(255,255,255,0.2);
            border-color: #f59e0b;
        }

        .controls button.active {
            background: rgba(245, 158, 11, 0.2);
            border-color: #f59e0b;
            color: #f59e0b;
        }

        .filter-info {
            text-align: center;
            color: #64748b;
            font-size: 0.85em;
            margin-bottom: 20px;
        }

        .category {
            margin-bottom: 30px;
        }

        .category-header {
            font-size: 1.1em;
            color: #60a5fa;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(96, 165, 250, 0.3);
        }

        .idea-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: all 0.2s;
        }

        .idea-card:hover {
            border-color: rgba(245, 158, 11, 0.5);
        }

        .idea-card.three-star {
            border-left: 3px solid #22c55e;
        }

        .idea-card.two-star {
            border-left: 3px solid #f59e0b;
        }

        .idea-card.one-star {
            border-left: 3px solid #64748b;
        }

        .idea-header {
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .idea-header:hover {
            background: rgba(255,255,255,0.02);
        }

        .idea-title-section {
            flex: 1;
        }

        .idea-title {
            font-size: 1em;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .idea-summary {
            font-size: 0.85em;
            color: #94a3b8;
        }

        .idea-meta-line {
            font-size: 0.75em;
            color: #64748b;
            margin-top: 6px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .idea-meta-line span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .idea-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .stars {
            font-size: 0.9em;
        }

        .tag {
            font-size: 0.7em;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .tag-high { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .tag-medium { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .tag-revolutionary { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
        .tag-low { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }

        .expand-icon {
            color: #64748b;
            transition: transform 0.2s;
            font-size: 1.2em;
        }

        .idea-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .idea-content {
            display: none;
            padding: 0 20px 20px 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .idea-card.expanded .idea-content {
            display: block;
        }

        .idea-content h4 {
            color: #f59e0b;
            font-size: 0.85em;
            margin: 15px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .idea-content p, .idea-content li {
            font-size: 0.9em;
            color: #cbd5e1;
        }

        .idea-content ul {
            margin-left: 20px;
        }

        .idea-content li {
            margin: 5px 0;
        }

        .idea-content a {
            color: #60a5fa;
            text-decoration: none;
        }

        .idea-content a:hover {
            text-decoration: underline;
        }

        .idea-content code {
            background: rgba(59, 130, 246, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #93c5fd;
        }

        .back-link {
            display: inline-block;
            color: #60a5fa;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .stats {
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #f59e0b;
        }

        .stat-label {
            font-size: 0.8em;
            color: #64748b;
        }

        .view-toggle {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .view-toggle button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .view-toggle button:hover {
            background: rgba(255,255,255,0.1);
        }

        .view-toggle button.active {
            background: rgba(96, 165, 250, 0.2);
            border-color: #60a5fa;
            color: #60a5fa;
        }

        .date-group-header {
            font-size: 0.9em;
            color: #94a3b8;
            margin: 20px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← Back to Home</a>

        <header>
            <h1>Research Idea Bank</h1>
            <p class="subtitle">Underexplored research opportunities identified through systematic analysis</p>
        </header>

        <div class="stats">
            <div class="stats-row">
                <div class="stat">
                    <div class="stat-value" id="total-count">-</div>
                    <div class="stat-label">Total Ideas</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="three-star-count">-</div>
                    <div class="stat-label">⭐⭐⭐ Exceptional</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="two-star-count">-</div>
                    <div class="stat-label">⭐⭐ Strong</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="one-star-count">-</div>
                    <div class="stat-label">⭐ Promising</div>
                </div>
            </div>
        </div>

        <div class="view-toggle">
            <button class="view-btn active" data-view="category" onclick="setView('category', this)">By Category</button>
            <button class="view-btn" data-view="recent" onclick="setView('recent', this)">Recently Added</button>
        </div>

        <div class="controls">
            <button onclick="expandAll()">Expand All</button>
            <button onclick="collapseAll()">Collapse All</button>
            <span style="color: #475569; padding: 8px;">|</span>
            <button class="filter-btn active" data-filter="all" onclick="filterByRating('all', this)">All</button>
            <button class="filter-btn" data-filter="3" onclick="filterByRating('3', this)">⭐⭐⭐ Only</button>
            <button class="filter-btn" data-filter="2" onclick="filterByRating('2', this)">⭐⭐ Only</button>
            <button class="filter-btn" data-filter="1" onclick="filterByRating('1', this)">⭐ Only</button>
        </div>

        <div class="filter-info" id="filter-info">Loading...</div>

        <div id="ideas-container">
            <div class="loading">Loading ideas from database...</div>
        </div>
    </div>

    <script>
        let ideas = [];
        let currentView = 'category';
        let currentFilter = 'all';

        // Load data from JSON file
        async function loadData() {
            try {
                const response = await fetch('../data/research_db.json');
                if (!response.ok) throw new Error('Failed to load data');
                const data = await response.json();
                ideas = data.ideas || [];
                updateStats();
                renderIdeas();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('ideas-container').innerHTML =
                    '<div class="error">Error loading data. Make sure research_db.json exists.</div>';
            }
        }

        function updateStats() {
            const total = ideas.length;
            const threeStar = ideas.filter(i => i.rating === 3).length;
            const twoStar = ideas.filter(i => i.rating === 2).length;
            const oneStar = ideas.filter(i => i.rating === 1).length;

            document.getElementById('total-count').textContent = total;
            document.getElementById('three-star-count').textContent = threeStar;
            document.getElementById('two-star-count').textContent = twoStar;
            document.getElementById('one-star-count').textContent = oneStar;
        }

        function getStarClass(stars) {
            if (stars === 3) return 'three-star';
            if (stars === 2) return 'two-star';
            return 'one-star';
        }

        function getStarEmoji(stars) {
            return '⭐'.repeat(stars);
        }

        function getFeasibilityClass(feasibility) {
            if (feasibility === 'high') return 'tag-high';
            if (feasibility === 'medium') return 'tag-medium';
            return 'tag-low';
        }

        function getImpactClass(impact) {
            if (impact === 'revolutionary') return 'tag-revolutionary';
            if (impact === 'high') return 'tag-high';
            return 'tag-medium';
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Unknown';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function formatAuthors(authors) {
            if (!authors || authors.length === 0) return 'Unknown';
            return authors.join(', ');
        }

        function getDateCategory(dateStr) {
            if (!dateStr) return 'Unknown Date';
            const date = new Date(dateStr);
            const now = new Date();
            const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return 'This Week';
            if (diffDays < 30) return 'This Month';
            return 'Older';
        }

        function createIdeaCard(idea) {
            const card = document.createElement('div');
            card.className = `idea-card ${getStarClass(idea.rating)}`;

            const detailsHtml = buildDetailsHtml(idea);

            card.innerHTML = `
                <div class="idea-header" onclick="toggleIdea(this)">
                    <div class="idea-title-section">
                        <div class="idea-title">${getStarEmoji(idea.rating)} ${idea.id}: ${idea.title}</div>
                        <div class="idea-summary">${idea.summary}</div>
                        <div class="idea-meta-line">
                            <span>📅 ${formatDate(idea.date_created || idea.date_added)}</span>
                            <span>✏️ ${formatAuthors(idea.authors)}</span>
                            ${idea.status ? `<span>📊 ${idea.status}</span>` : ''}
                        </div>
                    </div>
                    <div class="idea-meta">
                        <span class="tag ${getFeasibilityClass(idea.feasibility)}">${idea.feasibility || 'TBD'}</span>
                        <span class="tag ${getImpactClass(idea.impact)}">${idea.impact || 'TBD'}</span>
                        <span class="expand-icon">▼</span>
                    </div>
                </div>
                <div class="idea-content">
                    ${detailsHtml}
                </div>
            `;
            return card;
        }

        function buildDetailsHtml(idea) {
            let html = '';

            if (idea.key_insight) {
                html += `<h4>Key Insight</h4><p>${idea.key_insight}</p>`;
            }

            if (idea.problem_statement) {
                html += `<h4>Problem Statement</h4><p>${idea.problem_statement}</p>`;
            }

            if (idea.why_interesting && idea.why_interesting.length) {
                html += `<h4>Why It's Interesting</h4><ul>${idea.why_interesting.map(w => `<li>${w}</li>`).join('')}</ul>`;
            }

            if (idea.why_hard && idea.why_hard.length) {
                html += `<h4>Why It's Hard</h4><ul>${idea.why_hard.map(w => `<li>${w}</li>`).join('')}</ul>`;
            }

            if (idea.approaches && idea.approaches.length) {
                html += `<h4>Approaches</h4><ul>${idea.approaches.map(a => `<li>${a}</li>`).join('')}</ul>`;
            }

            if (idea.candidate_approaches && idea.candidate_approaches.length) {
                html += `<h4>Candidate Approaches</h4><ul>${idea.candidate_approaches.map(a => `<li>${a}</li>`).join('')}</ul>`;
            }

            if (idea.next_steps && idea.next_steps.length) {
                html += `<h4>Next Steps</h4><ul>${idea.next_steps.map((s, i) => `<li>${i + 1}. ${s}</li>`).join('')}</ul>`;
            }

            if (idea.recommended_contacts && idea.recommended_contacts.length) {
                html += `<h4>Recommended Contacts</h4><ul>${idea.recommended_contacts.map(c => `<li>${c}</li>`).join('')}</ul>`;
            }

            if (idea.references && idea.references.length) {
                html += `<h4>References</h4><ul>${idea.references.map(r => `<li><a href="${r}" target="_blank">${r}</a></li>`).join('')}</ul>`;
            }

            if (idea.evaluator_notes) {
                html += `<h4>Evaluator Notes</h4><p>${idea.evaluator_notes}</p>`;
            }

            if (idea.failure_reason) {
                html += `<h4>Why It Failed</h4><p>${idea.failure_reason}</p>`;
            }

            if (idea.tags && idea.tags.length) {
                html += `<h4>Tags</h4><p>${idea.tags.map(t => `<code>${t}</code>`).join(' ')}</p>`;
            }

            return html || '<p>No additional details available.</p>';
        }

        function renderIdeas() {
            const container = document.getElementById('ideas-container');
            container.innerHTML = '';

            // Filter ideas by rating
            let filteredIdeas = ideas.filter(idea => {
                if (currentFilter === 'all') return true;
                return idea.rating === parseInt(currentFilter);
            });

            if (filteredIdeas.length === 0) {
                container.innerHTML = '<div class="loading">No ideas match the current filter.</div>';
                document.getElementById('filter-info').textContent = 'No ideas found';
                return;
            }

            if (currentView === 'category') {
                renderByCategoryView(container, filteredIdeas);
            } else {
                renderByRecentView(container, filteredIdeas);
            }

            document.getElementById('filter-info').textContent =
                currentFilter === 'all'
                    ? `Showing all ${filteredIdeas.length} ideas`
                    : `Showing ${filteredIdeas.length} ${getStarEmoji(parseInt(currentFilter))} ideas`;
        }

        function renderByCategoryView(container, filteredIdeas) {
            // Group by category
            const categories = {};
            filteredIdeas.forEach(idea => {
                const cat = idea.category || 'uncategorized';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(idea);
            });

            // Sort categories alphabetically
            const sortedCategories = Object.keys(categories).sort();

            for (const category of sortedCategories) {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                categoryDiv.innerHTML = `<h2 class="category-header">${category.toUpperCase().replace(/-/g, ' ')}</h2>`;

                // Sort ideas within category by rating (highest first)
                categories[category].sort((a, b) => b.rating - a.rating);

                categories[category].forEach(idea => {
                    categoryDiv.appendChild(createIdeaCard(idea));
                });

                container.appendChild(categoryDiv);
            }
        }

        function renderByRecentView(container, filteredIdeas) {
            // Sort by date_modified or date_created (most recent first)
            const sorted = [...filteredIdeas].sort((a, b) => {
                const dateA = new Date(a.date_modified || a.date_created || a.date_added || 0);
                const dateB = new Date(b.date_modified || b.date_created || b.date_added || 0);
                return dateB - dateA;
            });

            // Group by date category
            const groups = {};
            sorted.forEach(idea => {
                const dateStr = idea.date_modified || idea.date_created || idea.date_added;
                const category = getDateCategory(dateStr);
                if (!groups[category]) groups[category] = [];
                groups[category].push(idea);
            });

            // Order of date categories
            const order = ['Today', 'Yesterday', 'This Week', 'This Month', 'Older', 'Unknown Date'];

            for (const group of order) {
                if (groups[group] && groups[group].length > 0) {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'category';
                    groupDiv.innerHTML = `<h2 class="date-group-header">${group}</h2>`;

                    groups[group].forEach(idea => {
                        groupDiv.appendChild(createIdeaCard(idea));
                    });

                    container.appendChild(groupDiv);
                }
            }
        }

        function setView(view, btn) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderIdeas();
        }

        function toggleIdea(header) {
            header.parentElement.classList.toggle('expanded');
        }

        function expandAll() {
            document.querySelectorAll('.idea-card').forEach(card => {
                card.classList.add('expanded');
            });
        }

        function collapseAll() {
            document.querySelectorAll('.idea-card').forEach(card => {
                card.classList.remove('expanded');
            });
        }

        function filterByRating(rating, btn) {
            currentFilter = rating;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderIdeas();
        }

        // Initial load
        loadData();
    </script>
</body>
</html>
