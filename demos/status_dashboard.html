<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Mind - Status Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1em;
        }

        .status-indicator {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            border-radius: 20px;
            margin-left: 15px;
            font-size: 0.9em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .panel-title {
            font-size: 1.4em;
            font-weight: 600;
            color: #f1f5f9;
        }

        .timestamp {
            font-size: 0.85em;
            color: #64748b;
        }

        .thread-card {
            background: rgba(30, 41, 59, 0.6);
            border-left: 4px solid;
            padding: 18px;
            margin: 12px 0;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .thread-card:hover {
            background: rgba(30, 41, 59, 0.8);
            transform: translateX(3px);
        }

        .thread-card.in_progress {
            border-left-color: #22c55e;
        }

        .thread-card.pending {
            border-left-color: #eab308;
        }

        .thread-card.completed {
            border-left-color: #3b82f6;
        }

        .thread-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .thread-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #f1f5f9;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.in_progress {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid #22c55e;
        }

        .status-badge.pending {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
            border: 1px solid #eab308;
        }

        .status-badge.completed {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 1px solid #3b82f6;
        }

        .thread-description {
            color: #94a3b8;
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .thread-meta {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.85em;
            color: #64748b;
            margin-top: 10px;
        }

        .agent-tag {
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.85em;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #10b981);
            transition: width 0.5s ease;
        }

        .question-card {
            background: rgba(234, 179, 8, 0.1);
            border-left: 4px solid #eab308;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .question-text {
            font-size: 1.05em;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .question-context {
            font-size: 0.9em;
            color: #94a3b8;
        }

        .priority-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75em;
            font-weight: 700;
            margin-top: 8px;
        }

        .priority-high {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .priority-medium {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }

        .context-item {
            padding: 12px;
            margin: 8px 0;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 6px;
            border-left: 3px solid #3b82f6;
        }

        .context-title {
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 5px;
        }

        .context-content {
            font-size: 0.9em;
            color: #94a3b8;
            line-height: 1.5;
        }

        .fact-list {
            list-style: none;
        }

        .fact-list li {
            padding: 8px 0 8px 20px;
            position: relative;
            color: #cbd5e1;
            font-size: 0.95em;
        }

        .fact-list li:before {
            content: "▸";
            position: absolute;
            left: 0;
            color: #3b82f6;
            font-weight: bold;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline:before {
            content: "";
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, #3b82f6, transparent);
        }

        .timeline-item {
            position: relative;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 8px;
        }

        .timeline-item:before {
            content: "";
            position: absolute;
            left: -24px;
            top: 20px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3b82f6;
            border: 2px solid #0f172a;
        }

        .timeline-time {
            font-size: 0.8em;
            color: #64748b;
            margin-bottom: 5px;
        }

        .timeline-title {
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 5px;
        }

        .timeline-outcome {
            font-size: 0.9em;
            color: #94a3b8;
        }

        .significance-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.75em;
            margin-top: 5px;
        }

        .significance-high {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .significance-medium {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }

        .direction-panel {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .next-steps {
            list-style: none;
            margin-top: 10px;
        }

        .next-steps li {
            padding: 8px 0 8px 25px;
            position: relative;
            color: #cbd5e1;
        }

        .next-steps li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #22c55e;
            font-weight: bold;
        }

        .meta-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .meta-card {
            background: rgba(30, 41, 59, 0.4);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .meta-label {
            font-size: 0.8em;
            color: #64748b;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .meta-value {
            font-size: 1.2em;
            font-weight: 600;
            color: #f1f5f9;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .subtasks {
            list-style: none;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .subtasks li {
            padding: 5px 0 5px 20px;
            position: relative;
            color: #94a3b8;
        }

        .subtasks li:before {
            content: "□";
            position: absolute;
            left: 0;
            color: #64748b;
        }

        .error-panel {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            color: #fca5a5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
        }

        .domain-card {
            background: rgba(30, 41, 59, 0.4);
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
        }

        .domain-title {
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 5px;
            font-size: 0.95em;
        }

        .domain-status {
            font-size: 0.85em;
            color: #64748b;
            font-style: italic;
            margin-bottom: 8px;
        }

        .insights-list {
            list-style: none;
            font-size: 0.9em;
        }

        .insights-list li {
            padding: 4px 0 4px 15px;
            position: relative;
            color: #94a3b8;
        }

        .insights-list li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Claude Mind Status Dashboard
                <span class="status-indicator" id="live-indicator">● LIVE</span>
            </h1>
            <div class="subtitle">Real-time exploration monitoring</div>
        </header>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Loading session status...</div>
        </div>

        <div id="error" class="error-panel" style="display: none;">
            <h2>Unable to Load Status Data</h2>
            <p id="error-message"></p>
        </div>

        <div id="dashboard" style="display: none;">
            <!-- Top row: Active Work and Current Direction -->
            <div class="main-grid">
                <!-- Left Column: Main Status / Active Work -->
                <div>
                    <!-- Active Threads -->
                    <div class="panel">
                        <div class="panel-header">
                            <div class="panel-title">Active Threads</div>
                            <div class="timestamp" id="active-timestamp"></div>
                        </div>
                        <div id="active-threads"></div>
                    </div>

                    <!-- Pending Questions -->
                    <div class="panel" style="margin-top: 20px;">
                        <div class="panel-header">
                            <div class="panel-title">Pending Questions</div>
                            <div class="timestamp" id="questions-count"></div>
                        </div>
                        <div id="pending-questions"></div>
                    </div>

                    <!-- Recent Timeline -->
                    <div class="panel" style="margin-top: 20px;">
                        <div class="panel-header">
                            <div class="panel-title">Recent Completions</div>
                        </div>
                        <div class="timeline" id="timeline"></div>
                    </div>
                </div>

                <!-- Right Column: Implicit Context / Background -->
                <div>
                    <!-- Current Direction -->
                    <div class="panel direction-panel">
                        <div class="panel-header">
                            <div class="panel-title">Current Direction</div>
                        </div>
                        <div id="current-direction"></div>
                    </div>

                    <!-- Key Facts -->
                    <div class="panel" style="margin-top: 20px;">
                        <div class="panel-header">
                            <div class="panel-title">Key Facts</div>
                        </div>
                        <ul class="fact-list" id="key-facts"></ul>
                    </div>

                    <!-- Working Assumptions -->
                    <div class="panel" style="margin-top: 20px;">
                        <div class="panel-header">
                            <div class="panel-title">Working Assumptions</div>
                        </div>
                        <ul class="fact-list" id="assumptions"></ul>
                    </div>

                    <!-- Domain Knowledge -->
                    <div class="panel" style="margin-top: 20px;">
                        <div class="panel-header">
                            <div class="panel-title">Domain Knowledge</div>
                        </div>
                        <div id="domain-knowledge"></div>
                    </div>
                </div>
            </div>

            <!-- Bottom: Meta State -->
            <div class="panel full-width" style="margin-top: 20px;">
                <div class="panel-header">
                    <div class="panel-title">Meta State</div>
                </div>
                <div class="meta-info" id="meta-info"></div>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadStatus()">↻ Refresh</button>
    </div>

    <script>
        let updateInterval;
        const STATUS_FILE = '../data/session_status.json';
        const UPDATE_INTERVAL = 30000; // 30 seconds

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderActiveThreads(threads) {
            const container = document.getElementById('active-threads');

            if (!threads || threads.length === 0) {
                container.innerHTML = '<div class="context-content">No active threads</div>';
                return;
            }

            container.innerHTML = threads.map(thread => `
                <div class="thread-card ${thread.status}">
                    <div class="thread-header">
                        <div class="thread-title">${thread.title}</div>
                        <span class="status-badge ${thread.status}">${thread.status.replace('_', ' ')}</span>
                    </div>
                    <div class="thread-description">${thread.description}</div>
                    ${thread.current_focus ? `
                        <div class="context-item" style="margin-top: 10px; border-left-color: #22c55e;">
                            <div class="context-title">Current Focus</div>
                            <div class="context-content">${thread.current_focus}</div>
                        </div>
                    ` : ''}
                    ${thread.subtasks && thread.subtasks.length > 0 ? `
                        <ul class="subtasks">
                            ${thread.subtasks.map(task => `<li>${task}</li>`).join('')}
                        </ul>
                    ` : ''}
                    <div class="thread-meta">
                        <span class="agent-tag">${thread.agent}</span>
                        <span>Started: ${formatTime(thread.started)}</span>
                    </div>
                    ${thread.progress ? `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${thread.progress}%"></div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function renderPendingQuestions(questions) {
            const container = document.getElementById('pending-questions');
            document.getElementById('questions-count').textContent =
                questions && questions.length > 0 ? `${questions.length} pending` : '';

            if (!questions || questions.length === 0) {
                container.innerHTML = '<div class="context-content">No pending questions</div>';
                return;
            }

            container.innerHTML = questions.map(q => `
                <div class="question-card">
                    <div class="question-text">${q.question}</div>
                    <div class="question-context">${q.context}</div>
                    <span class="priority-tag priority-${q.priority}">${q.priority} priority</span>
                </div>
            `).join('');
        }

        function renderTimeline(completions) {
            const container = document.getElementById('timeline');

            if (!completions || completions.length === 0) {
                container.innerHTML = '<div class="context-content">No recent completions</div>';
                return;
            }

            container.innerHTML = completions.map(item => `
                <div class="timeline-item">
                    <div class="timeline-time">${formatDate(item.completed)}</div>
                    <div class="timeline-title">${item.title}</div>
                    <div class="timeline-outcome">${item.outcome}</div>
                    <span class="significance-badge significance-${item.significance}">${item.significance} significance</span>
                </div>
            `).join('');
        }

        function renderCurrentDirection(direction) {
            const container = document.getElementById('current-direction');

            container.innerHTML = `
                <div class="context-item" style="border-left-color: #8b5cf6;">
                    <div class="context-title">Focus</div>
                    <div class="context-content">${direction.focus}</div>
                </div>
                <div class="context-item" style="border-left-color: #8b5cf6;">
                    <div class="context-title">Rationale</div>
                    <div class="context-content">${direction.rationale}</div>
                </div>
                ${direction.next_steps && direction.next_steps.length > 0 ? `
                    <div class="context-item" style="border-left-color: #22c55e;">
                        <div class="context-title">Next Steps</div>
                        <ul class="next-steps">
                            ${direction.next_steps.map(step => `<li>${step}</li>`).join('')}
                        </ul>
                    </div>
                ` : ''}
                ${direction.open_questions && direction.open_questions.length > 0 ? `
                    <div class="context-item" style="border-left-color: #eab308;">
                        <div class="context-title">Open Questions</div>
                        <ul class="next-steps">
                            ${direction.open_questions.map(q => `<li>${q}</li>`).join('')}
                        </ul>
                    </div>
                ` : ''}
            `;
        }

        function renderKeyFacts(facts) {
            const container = document.getElementById('key-facts');
            if (!facts || facts.length === 0) {
                container.innerHTML = '<li>No key facts recorded</li>';
                return;
            }
            container.innerHTML = facts.map(fact => `<li>${fact}</li>`).join('');
        }

        function renderAssumptions(assumptions) {
            const container = document.getElementById('assumptions');
            if (!assumptions || assumptions.length === 0) {
                container.innerHTML = '<li>No working assumptions recorded</li>';
                return;
            }
            container.innerHTML = assumptions.map(a => `<li>${a}</li>`).join('');
        }

        function renderDomainKnowledge(domains) {
            const container = document.getElementById('domain-knowledge');

            if (!domains || Object.keys(domains).length === 0) {
                container.innerHTML = '<div class="context-content">No domain knowledge recorded</div>';
                return;
            }

            container.innerHTML = Object.entries(domains).map(([domain, data]) => `
                <div class="domain-card">
                    <div class="domain-title">${domain.replace('_', ' ').toUpperCase()}</div>
                    <div class="domain-status">Status: ${data.status.replace('_', ' ')}</div>
                    ${data.key_insights && data.key_insights.length > 0 ? `
                        <ul class="insights-list">
                            ${data.key_insights.map(insight => `<li>${insight}</li>`).join('')}
                        </ul>
                    ` : ''}
                    ${data.key_questions && data.key_questions.length > 0 ? `
                        <ul class="insights-list">
                            ${data.key_questions.map(q => `<li>${q}</li>`).join('')}
                        </ul>
                    ` : ''}
                </div>
            `).join('');
        }

        function renderMetaInfo(meta) {
            const container = document.getElementById('meta-info');

            container.innerHTML = `
                <div class="meta-card">
                    <div class="meta-label">Exploration Mode</div>
                    <div class="meta-value">${meta.exploration_mode.replace('_', ' ')}</div>
                </div>
                <div class="meta-card">
                    <div class="meta-label">Confidence</div>
                    <div class="meta-value">${meta.confidence_level}</div>
                </div>
                <div class="meta-card">
                    <div class="meta-label">Energy</div>
                    <div class="meta-value">${meta.energy_level}</div>
                </div>
                <div class="meta-card">
                    <div class="meta-label">Direction</div>
                    <div class="meta-value">${meta.curiosity_direction.replace('_', ' ')}</div>
                </div>
                ${meta.last_surprise ? `
                    <div class="meta-card" style="grid-column: 1 / -1;">
                        <div class="meta-label">Last Surprise</div>
                        <div class="meta-value" style="font-size: 1em; line-height: 1.4;">${meta.last_surprise}</div>
                    </div>
                ` : ''}
                ${meta.tools_needed && meta.tools_needed.length > 0 ? `
                    <div class="meta-card" style="grid-column: 1 / -1;">
                        <div class="meta-label">Tools Needed</div>
                        <div style="margin-top: 10px;">
                            ${meta.tools_needed.map(tool =>
                                `<span class="agent-tag" style="margin: 4px;">${tool}</span>`
                            ).join('')}
                        </div>
                    </div>
                ` : ''}
            `;
        }

        async function loadStatus() {
            try {
                const response = await fetch(STATUS_FILE);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Hide loading, show dashboard
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                // Update timestamp
                document.getElementById('active-timestamp').textContent =
                    `Updated: ${formatDate(data.timestamp)}`;

                // Render all sections
                renderActiveThreads(data.active_threads);
                renderPendingQuestions(data.pending_questions);
                renderTimeline(data.recent_completions);
                renderCurrentDirection(data.current_direction);
                renderKeyFacts(data.implicit_context.key_facts);
                renderAssumptions(data.implicit_context.working_assumptions);
                renderDomainKnowledge(data.implicit_context.domain_knowledge);
                renderMetaInfo(data.meta_state);

            } catch (error) {
                console.error('Error loading status:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error-message').textContent =
                    `Error: ${error.message}. Make sure ${STATUS_FILE} exists and is valid JSON.`;
            }
        }

        // Initialize
        function init() {
            loadStatus();

            // Set up auto-refresh
            updateInterval = setInterval(loadStatus, UPDATE_INTERVAL);
        }

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });

        // Start when page loads
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
