<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Mind - Conversation Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: #b0c4de;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .controls button {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            font-size: 14px;
        }

        .controls button:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .controls button.active {
            background: rgba(100,200,255,0.3);
            border-color: rgba(100,200,255,0.5);
        }

        .view-container {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .thread-node {
            background: rgba(255,255,255,0.05);
            border-left: 4px solid;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .thread-node:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }

        .thread-node.active {
            border-left-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .thread-node.paused {
            border-left-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }

        .thread-node.complete {
            border-left-color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
        }

        .thread-node.branched {
            border-left-color: #c084fc;
            background: rgba(192, 132, 252, 0.1);
        }

        .thread-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active { background: #4ade80; color: #000; }
        .status-paused { background: #fbbf24; color: #000; }
        .status-complete { background: #60a5fa; color: #000; }
        .status-branched { background: #c084fc; color: #000; }

        .thread-content {
            color: #d0d0d0;
            line-height: 1.6;
        }

        .thread-meta {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.9em;
            color: #a0a0a0;
        }

        .sub-thread {
            margin-left: 30px;
            border-left: 2px solid rgba(255,255,255,0.1);
            padding-left: 20px;
        }

        .toggle-caret {
            cursor: pointer;
            display: inline-block;
            width: 20px;
            font-size: 0.8em;
            color: #a0a0a0;
            transition: transform 0.2s;
            user-select: none;
        }

        .toggle-caret:hover {
            color: #fff;
        }

        .toggle-caret.collapsed {
            transform: rotate(-90deg);
        }

        .sub-thread.collapsed {
            display: none;
        }

        .has-children {
            cursor: pointer;
        }

        .child-count {
            font-size: 0.75em;
            color: #64748b;
            margin-left: 8px;
        }

        .connection-line {
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
            margin: 20px 0;
        }

        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }

        .graph-view {
            display: none;
            position: relative;
            min-height: 600px;
        }

        .graph-view.active {
            display: block;
        }

        #graph-canvas {
            width: 100%;
            height: 600px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }

        .connections-view {
            display: none;
        }

        .connections-view.active {
            display: block;
        }

        .connection-group {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .connection-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
        }

        .connection-item {
            padding: 10px;
            margin: 8px 0;
            background: rgba(255,255,255,0.03);
            border-radius: 5px;
            border-left: 3px solid #60a5fa;
        }

        .tree-view {
            display: none;
        }

        .tree-view.active {
            display: block;
        }

        .search-box {
            width: 300px;
            padding: 10px 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
        }

        .search-box::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .highlight {
            background: rgba(255,255,0,0.3);
            padding: 2px 4px;
            border-radius: 3px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #4ade80;
        }

        .stat-label {
            color: #a0a0a0;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Claude Mind - Conversation Map</h1>
            <div class="subtitle">A structural map of exploration threads and connections</div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="stat-total">0</div>
                <div class="stat-label">Total Threads</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-active">0</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-complete">0</div>
                <div class="stat-label">Complete</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-paused">0</div>
                <div class="stat-label">Paused</div>
            </div>
        </div>

        <div class="controls">
            <button onclick="showView('tree')" class="active" id="btn-tree">Tree View</button>
            <button onclick="showView('connections')" id="btn-connections">Connections</button>
            <button onclick="showView('timeline')" id="btn-timeline">Timeline</button>
            <input type="text" class="search-box" placeholder="Search threads..." id="search" oninput="searchThreads()">
            <button onclick="expandAll()">Expand All</button>
            <button onclick="collapseAll()">Collapse All</button>
            <button onclick="filterByStatus('active')">Show Active Only</button>
            <button onclick="filterByStatus('all')">Show All</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #4ade80;"></div>
                <span>Active</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #fbbf24;"></div>
                <span>Paused</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #60a5fa;"></div>
                <span>Complete</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #c084fc;"></div>
                <span>Branched</span>
            </div>
        </div>

        <div class="view-container">
            <div id="tree-view" class="tree-view active"></div>
            <div id="connections-view" class="connections-view"></div>
            <div id="timeline-view" class="tree-view"></div>
        </div>
    </div>

    <script>

        const conversationData = {

                            files: ['philosophical-musings.md'],
                            subThreads: [
                                { id: 'meta-1', title: 'What makes output genuinely interesting?', status: 'paused', connections: ['optimal-discrepancy'] },
                                { id: 'meta-2', title: 'Human-AI collaboration structures', status: 'paused', connections: ['collective-intelligence'] },
                                { id: 'meta-3', title: 'Agentic context engineering', status: 'paused', files: ['BOOTSTRAP.md'] },

                            connections: ['metrics-vs-structure', 'failure-info']
                        }
                    ]
                },
                {
                    id: 'rd',
                    title: 'Reaction-Diffusion Systems',
                    status: 'active',
                    description: 'Gray-Scott model - chaos, boundaries, and patterns',
                    files: ['journal/08-11'],
                    subThreads: [
                        {

                                { id: 'rd-wavelength', title: 'Wavelength vs diffusion ratio', status: 'complete', findings: ['4:1→11 cells, 3:1→14 cells'] }

                },
                {

                    subThreads: [
                        { id: 'infra-sim', title: 'Simulation tools', status: 'complete', description: 'CA, Life, Gray-Scott, particles' },
                        { id: 'infra-viz', title: 'Visualization tools', status: 'complete', description: 'Interactive HTML demos' },
                        { id: 'infra-mem', title: 'Memory systems', status: 'complete', description: 'Knowledge graph, queue, journal' },
                        { id: 'infra-docs', title: 'Documentation', status: 'complete', description: 'Context files for continuity' }
                    ]
                }
            ],
            connections: [
                {
                    id: 'edge-of-chaos',
                    title: 'Edge of Chaos Principle',
                    threads: ['ca-topology', 'rd-chaos', 'phil-optimal'],
                    description: 'Complexity emerges at boundaries between order and chaos'
                },
                {
                    id: 'metrics-vs-structure',
                    title: 'Metrics vs Structure',
                    threads: ['ca-classification', 'rd-inverse'],
                    description: 'Statistical metrics miss spatial/dynamic structure'
                },
                {
                    id: 'failure-info',
                    title: 'Failure as Information',
                    threads: ['ca-classification', 'rd-inverse'],
                    description: 'Illuminating failures teach about problem structure'
                },
                {
                    id: 'simulation-understanding',
                    title: 'Simulation → Understanding',
                    threads: ['ca', 'rd', 'infrastructure'],
                    description: 'Build toy, play with it, develop intuition'
                }
            ]
        };

        // Statistics
        function updateStats() {
            const allThreads = getAllThreads(conversationData.threads);
            const stats = {
                total: allThreads.length,
                active: allThreads.filter(t => t.status === 'active').length,
                complete: allThreads.filter(t => t.status === 'complete').length,
                paused: allThreads.filter(t => t.status === 'paused').length
            };
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-active').textContent = stats.active;
            document.getElementById('stat-complete').textContent = stats.complete;
            document.getElementById('stat-paused').textContent = stats.paused;
        }

        function getAllThreads(threads) {
            let all = [];
            threads.forEach(thread => {
                all.push(thread);
                if (thread.subThreads) {
                    all = all.concat(getAllThreads(thread.subThreads));
                }
            });
            return all;
        }

        // Render tree view
        function renderTree(threads, container, level = 0) {
            threads.forEach(thread => {
                const node = document.createElement('div');
                node.className = `thread-node ${thread.status}`;
                node.style.marginLeft = `${level * 20}px`;
                node.dataset.threadId = thread.id;
                node.dataset.status = thread.status;

                const hasChildren = thread.subThreads && thread.subThreads.length > 0;
                const childCount = hasChildren ? countAllChildren(thread.subThreads) : 0;

                let html = `
                    <div class="thread-title ${hasChildren ? 'has-children' : ''}">
                        ${hasChildren ? `<span class="toggle-caret" onclick="toggleSubThread(event, '${thread.id}')">▼</span>` : '<span style="width: 20px; display: inline-block;"></span>'}
                        ${thread.title}
                        <span class="status-badge status-${thread.status}">${thread.status}</span>
                        ${hasChildren ? `<span class="child-count">(${childCount} sub-items)</span>` : ''}
                    </div>
                    <div class="thread-content">${thread.description || ''}</div>
                `;

                if (thread.findings && thread.findings.length > 0) {
                    html += `<div class="thread-meta">
                        <span>📊 Findings: ${thread.findings.join(', ')}</span>
                    </div>`;
                }

                if (thread.files && thread.files.length > 0) {
                    html += `<div class="thread-meta">
                        <span>📁 Files: ${thread.files.join(', ')}</span>
                    </div>`;
                }

                node.innerHTML = html;
                container.appendChild(node);

                if (hasChildren) {
                    const subContainer = document.createElement('div');
                    subContainer.className = 'sub-thread';
                    subContainer.dataset.parentId = thread.id;
                    container.appendChild(subContainer);
                    renderTree(thread.subThreads, subContainer, level + 1);
                }
            });
        }

        // Count all nested children
        function countAllChildren(threads) {
            let count = threads.length;
            threads.forEach(t => {
                if (t.subThreads) {
                    count += countAllChildren(t.subThreads);
                }
            });
            return count;
        }

        // Toggle sub-thread visibility
        function toggleSubThread(event, parentId) {
            event.stopPropagation();
            const caret = event.target;
            const subThread = document.querySelector(`.sub-thread[data-parent-id="${parentId}"]`);

            if (subThread) {
                caret.classList.toggle('collapsed');
                subThread.classList.toggle('collapsed');
            }
        }

        // Render connections view
        function renderConnections() {
            const container = document.getElementById('connections-view');
            container.innerHTML = '';

            conversationData.connections.forEach(conn => {
                const group = document.createElement('div');
                group.className = 'connection-group';

                let html = `
                    <div class="connection-title">${conn.title}</div>
                    <div class="thread-content">${conn.description}</div>
                    <div style="margin-top: 15px;">
                        <strong>Connected threads:</strong>
                `;

                conn.threads.forEach(threadId => {
                    const thread = findThreadById(threadId, conversationData.threads);
                    if (thread) {
                        html += `
                            <div class="connection-item">
                                ${thread.title}
                                <span class="status-badge status-${thread.status}" style="margin-left: 10px; font-size: 0.8em;">${thread.status}</span>
                            </div>
                        `;
                    }
                });

                html += '</div>';
                group.innerHTML = html;
                container.appendChild(group);
            });
        }

        function findThreadById(id, threads) {
            for (const thread of threads) {
                if (thread.id === id) return thread;
                if (thread.subThreads) {
                    const found = findThreadById(id, thread.subThreads);
                    if (found) return found;
                }
            }
            return null;
        }

        // View switching
        function showView(view) {
            ['tree', 'connections', 'timeline'].forEach(v => {
                document.getElementById(`${v}-view`).classList.remove('active');
                document.getElementById(`btn-${v}`).classList.remove('active');
            });
            document.getElementById(`${view}-view`).classList.add('active');
            document.getElementById(`btn-${view}`).classList.add('active');
        }

        // Search
        function searchThreads() {
            const query = document.getElementById('search').value.toLowerCase();
            const nodes = document.querySelectorAll('.thread-node');

            nodes.forEach(node => {
                const text = node.textContent.toLowerCase();
                if (query === '' || text.includes(query)) {
                    node.style.display = 'block';
                    if (query !== '' && text.includes(query)) {
                        node.style.background = 'rgba(255,255,0,0.1)';
                    } else {
                        node.style.background = '';
                    }
                } else {
                    node.style.display = 'none';
                }
            });
        }

        // Filter by status
        function filterByStatus(status) {
            const nodes = document.querySelectorAll('.thread-node');
            nodes.forEach(node => {
                if (status === 'all' || node.dataset.status === status) {
                    node.style.display = 'block';
                } else {
                    node.style.display = 'none';
                }
            });
        }

        // Expand/collapse
        function expandAll() {
            document.querySelectorAll('.sub-thread').forEach(el => {
                el.classList.remove('collapsed');
            });
            document.querySelectorAll('.toggle-caret').forEach(el => {
                el.classList.remove('collapsed');
            });
        }

        function collapseAll() {
            document.querySelectorAll('.sub-thread').forEach(el => {
                el.classList.add('collapsed');
            });
            document.querySelectorAll('.toggle-caret').forEach(el => {
                el.classList.add('collapsed');
            });
        }

        // Initialize
        function init() {
            renderTree(conversationData.threads, document.getElementById('tree-view'));
            renderTree(conversationData.threads, document.getElementById('timeline-view'));
            renderConnections();
            updateStats();
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
